name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @repo-org/shared build
      - run: pnpm --filter @repo-org/api exec tsc -p tsconfig.json --noEmit
      - run: pnpm --filter bagsy build
      - run: node packages/cli/dist/bagsy.js --help
      - name: Pack CLI (smoke)
        run: |
          cd packages/cli
          npm pack --dry-run
